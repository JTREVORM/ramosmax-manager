name: ramosmax_auto_manager
description: "RamosMAX Automotive Care Management System - RamosMAX Automotive Care (U) Ltd."
publish_to: 'none'

# Versioning: MAJOR.MINOR.PATCH+BUILD - see docs/VERSIONING.md.
# BUILD must increase on EVERY store upload (Android versionCode / iOS CFBundleVersion).
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  connectivity_plus: ^7.3.1
  cloud_functions: ^6.5.0
  image_picker: ^1.2.3
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  fake_cloud_firestore: ^4.3.0
  firebase_auth_mocks: ^0.15.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# App icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/app_icon_1024.png"
  adaptive_icon_background: "#362060"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  min_sdk_android: 23

# Native launch screen: `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#362060"
  image: "assets/branding/ramosmax_logo.png"
  android_12:
    color: "#362060"
    image: "assets/branding/app_icon_foreground.png"
  web: false
