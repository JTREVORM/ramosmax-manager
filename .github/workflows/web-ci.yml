name: RamosMAX Web CI

# Phase A onward. The Flutter reference implementation is NOT touched by this
# workflow: it remains the reference until the web system reaches verified
# feature parity.
on:
  push:
    branches: ['**']
    paths: ['ramosmax-web/**', '.github/workflows/web-ci.yml']
  pull_request:
    paths: ['ramosmax-web/**', '.github/workflows/web-ci.yml']

defaults:
  run:
    working-directory: ramosmax-web

jobs:
  verify:
    runs-on: ubuntu-latest

    # The database suite runs against a real PostgreSQL server, not a mock:
    # RLS, privileges and SECURITY DEFINER behaviour cannot be verified any
    # other way.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: devonly
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_ADMIN_URL: postgres://postgres:devonly@127.0.0.1:5432/postgres
      DATABASE_URL: postgres://postgres:devonly@127.0.0.1:5432/ramosmax_dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ramosmax-web/package-lock.json

      - run: npm ci

      # The permission catalogue is GENERATED from the Phase 9 reference
      # implementation. If regenerating changes anything, the committed copy
      # has drifted from the reference and the build must fail — this is the
      # web replacement for the Dart/rules/catalogue three-way drift test.
      - name: Permission catalogue is in sync with the reference
        run: |
          npm run gen:permissions
          git diff --exit-code -- src/lib/permissions/catalogue.generated.ts \
                                  supabase/migrations/0002_permission_catalogue.sql

      - name: Migrations parse against the PostgreSQL grammar
        run: npm run check:sql

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      # Applies every migration to a fresh database, then runs the schema,
      # RLS, permission-parity and authentication suites against it.
      - name: Database, RLS, permission parity and business rules
        run: |
          npm run db:reset
          npm run test:db

      - run: npm run build
